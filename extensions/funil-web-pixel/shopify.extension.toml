# Web Pixels Extension — captura os eventos padrão do storefront (inclusive no
# checkout) e envia ao endpoint de ingestão do dashboard (/api/pixel), carimbando
# as UTMs da sessão para atribuição de primeiro clique.
#
# Deploy:  shopify app deploy   (dentro de um app Shopify com esta extensão)
# Depois, ative o pixel no admin e configure o campo "endpoint".

api_version = "2025-01"

[[extensions]]
name = "Funil Omnichannel"
handle = "funil-web-pixel"
type = "web_pixel_extension"
runtime_context = "strict"

  [extensions.settings]
  type = "object"

    [extensions.settings.fields.endpoint]
    name = "endpoint"
    description = "URL pública do endpoint de ingestão (ex: https://seu-app.com/api/pixel)"
    type = "single_line_text_field"
    validations = [{ name = "min", value = "1" }]
